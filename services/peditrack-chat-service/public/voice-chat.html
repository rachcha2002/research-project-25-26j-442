<!DOCTYPE html>
<html lang="en">
<!-- v1.1 Force Update -->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PediTrack Live Voice</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1b1e;
            color: white;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .container {
            width: 100%;
            max-width: 500px;
            padding: 20px;
            text-align: center;
            display: flex;
            flex-direction: column;
            height: 100%;
        }
        .header {
            margin-bottom: auto;
            padding-top: 20px;
        }
        .status-badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            background: rgba(255,255,255,0.1);
            font-size: 0.9rem;
            margin-bottom: 10px;
            transition: all 0.3s;
        }
        .status-badge.connected { background: rgba(16, 185, 129, 0.2); color: #10B981; }
        .status-badge.error { background: rgba(239, 68, 68, 0.2); color: #EF4444; }
        .status-badge.connecting { background: rgba(251, 191, 36, 0.2); color: #FBBF24; }
        
        .visualizer {
            height: 150px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 20px 0;
            gap: 4px;
        }
        .bar {
            width: 6px;
            background: #6366f1;
            border-radius: 3px;
            height: 10px;
            transition: height 0.1s ease;
        }
        .bar.active { background: #818cf8; box-shadow: 0 0 10px #818cf8; }
        
        .controls {
            margin-top: auto;
            margin-bottom: 40px;
        }
        .mic-btn {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: #4f46e5;
            border: none;
            color: white;
            font-size: 32px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(79, 70, 229, 0.4);
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .mic-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .mic-btn:active { transform: scale(0.95); }
        .mic-btn.listening {
            background: #ef4444;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); }
            70% { box-shadow: 0 0 0 20px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }
        
        .transcript-area {
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            padding: 15px;
            margin: 20px 0;
            min-height: 100px;
            text-align: left;
            font-size: 1.1rem;
            line-height: 1.5;
        }
        
        .debug-info {
            font-size: 0.7rem;
            color: #666;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div id="status" class="status-badge">Ready</div>
            <h2>Gemini Live</h2>
        </div>

        <div class="transcript-area" id="transcript">
            Tap the microphone to start a live conversation...
        </div>

        <div class="visualizer" id="visualizer">
            <!-- Bars generated by JS -->
        </div>

        <div class="controls">
            <button id="micBtn" class="mic-btn">🎙️</button>
        </div>
        
        <div class="debug-info" id="debugInfo"></div>
    </div>

    <script>
        // ===== CONFIGURATION =====
        // Using Railway hosted backend with HTTPS/WSS
        const SERVER_HOST = 'peditrack-chat-service-production-0d1d.up.railway.app';
        // Generate a random conversation ID to ensure fresh context
        const conversationId = 'voice-' + Math.random().toString(36).substring(2, 9) + '-' + Date.now();
        const WS_URL = `wss://${SERVER_HOST}/ws/live?conversationId=${conversationId}`;
        const SAMPLE_RATE = 16000;
        
        // ===== STATE =====
        let ws = null;
        let audioContext = null;
        let processor = null;
        let mediaStream = null;
        let isListening = false;
        let isConnecting = false;

        // ===== DOM ELEMENTS =====
        const statusEl = document.getElementById('status');
        const micBtn = document.getElementById('micBtn');
        const visualizer = document.getElementById('visualizer');
        const transcriptEl = document.getElementById('transcript');
        const debugInfo = document.getElementById('debugInfo');

        // Show debug info
        debugInfo.textContent = `WS: ${WS_URL}`;

        // Create visualizer bars
        for (let i = 0; i < 15; i++) {
            const bar = document.createElement('div');
            bar.className = 'bar';
            visualizer.appendChild(bar);
        }
        const bars = document.querySelectorAll('.bar');

        // ===== STATUS HELPERS =====
        function updateStatus(text, type = '') {
            statusEl.textContent = text;
            statusEl.className = 'status-badge ' + type;
        }

        function log(message) {
            console.log('[VoiceChat]', message);
            debugInfo.textContent = message;
        }

        // ===== AUDIO INITIALIZATION =====
        async function initAudio() {
            try {
                log('Requesting microphone...');
                
                mediaStream = await navigator.mediaDevices.getUserMedia({
                    audio: {
                        channelCount: 1,
                        sampleRate: SAMPLE_RATE,
                        echoCancellation: true,
                        noiseSuppression: true,
                        autoGainControl: true
                    }
                });

                audioContext = new (window.AudioContext || window.webkitAudioContext)({
                    sampleRate: SAMPLE_RATE,
                });

                log(`Mic: ${mediaStream.getAudioTracks()[0].getSettings().sampleRate || audioContext.sampleRate}Hz -> ${SAMPLE_RATE}Hz`);

                const input = audioContext.createMediaStreamSource(mediaStream);
                processor = audioContext.createScriptProcessor(4096, 1, 1);
                
                input.connect(processor);
                processor.connect(audioContext.destination);

                processor.onaudioprocess = (e) => {
                    if (!isListening || !ws || ws.readyState !== WebSocket.OPEN) return;

                    const inputData = e.inputBuffer.getChannelData(0);
                    // Use native sample rate - no downsampling gives better quality for Gemini
                    const currentSampleRate = audioContext.sampleRate;
                    
                    updateVisualizer(inputData);

                    // Convert float32 to int16 PCM and send
                    const pcmData = floatTo16BitPCM(inputData);
                    ws.send(JSON.stringify({
                        type: 'audio',
                        data: arrayBufferToBase64(pcmData),
                        sampleRate: currentSampleRate // Tell backend the actual rate
                    }));
                };

                log('Microphone ready');
                return true;
            } catch (err) {
                console.error('Audio init error:', err);
                log('Mic error: ' + err.message);
                updateStatus('Microphone Error', 'error');
                return false;
            }
        }

        // ===== WEBSOCKET CONNECTION =====
        function connectWebSocket() {
            return new Promise((resolve, reject) => {
                log(`Connecting to ${WS_URL}...`);
                updateStatus('Connecting...', 'connecting');
                isConnecting = true;

                try {
                    ws = new WebSocket(WS_URL);
                } catch (err) {
                    log('WS create error: ' + err.message);
                    reject(err);
                    return;
                }
                
                const timeout = setTimeout(() => {
                    log('Connection timeout');
                    ws.close();
                    reject(new Error('Connection timeout'));
                }, 10000);

                ws.onopen = () => {
                    clearTimeout(timeout);
                    isConnecting = false;
                    log('Connected!');
                    updateStatus('Connected', 'connected');
                    resolve();
                };

                ws.onmessage = async (event) => {
                    try {
                        const msg = JSON.parse(event.data);
                        
                        if (msg.type === 'audio') {
                            playPcmAudio(msg.data);
                        } else if (msg.type === 'text') {
                            transcriptEl.textContent = msg.text;
                        } else if (msg.type === 'session_created') {
                            log('Session: ' + msg.sessionId.substring(0, 8) + '...');
                        } else if (msg.type === 'setup_complete') {
                            log('Gemini ready');
                        } else if (msg.type === 'error') {
                            log('Error: ' + msg.error);
                            updateStatus('Error', 'error');
                            transcriptEl.textContent = 'Error: ' + msg.error;
                        }
                    } catch (err) {
                        console.error('Message parse error:', err);
                    }
                };

                ws.onclose = (event) => {
                    clearTimeout(timeout);
                    isConnecting = false;
                    isListening = false;
                    micBtn.classList.remove('listening');
                    log(`Disconnected (code: ${event.code})`);
                    updateStatus('Disconnected', 'error');
                    transcriptEl.textContent = 'Connection closed. Tap to reconnect.';
                    ws = null;
                };

                ws.onerror = (e) => {
                    clearTimeout(timeout);
                    isConnecting = false;
                    console.error('WS Error:', e);
                    log('Connection failed');
                    updateStatus('Connection Failed', 'error');
                    reject(new Error('WebSocket error'));
                };
            });
        }

        // ===== MIC BUTTON HANDLER =====
        micBtn.onclick = async () => {
            // Already connecting, ignore
            if (isConnecting) {
                log('Already connecting...');
                return;
            }

            // If already connected and listening, toggle off
            if (ws && ws.readyState === WebSocket.OPEN && isListening) {
                stopListening();
                return;
            }

            // If connected but not listening, start listening
            if (ws && ws.readyState === WebSocket.OPEN && !isListening) {
                startListening();
                return;
            }

            // Need to initialize everything
            micBtn.disabled = true;
            
            try {
                // Step 1: Initialize audio if needed
                if (!audioContext) {
                    const audioOk = await initAudio();
                    if (!audioOk) {
                        micBtn.disabled = false;
                        return;
                    }
                }

                // Step 2: Connect WebSocket
                await connectWebSocket();

                // Step 3: Start listening
                startListening();
                
            } catch (err) {
                log('Failed: ' + err.message);
                updateStatus('Failed', 'error');
            }

            micBtn.disabled = false;
        };

        function startListening() {
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                log('Not connected');
                return;
            }
            
            if (audioContext && audioContext.state === 'suspended') {
                audioContext.resume();
            }
            
            isListening = true;
            micBtn.classList.add('listening');
            updateStatus('Listening...', 'connected');
            transcriptEl.textContent = 'Listening... Speak now!';
            log('Listening started');
        }

        function stopListening() {
            isListening = false;
            micBtn.classList.remove('listening');
            updateStatus('Paused', '');
            log('Paused');
        }

        // ===== AUDIO HELPERS =====
        function floatTo16BitPCM(input) {
            const buffer = new ArrayBuffer(input.length * 2);
            const view = new DataView(buffer);
            for (let i = 0; i < input.length; i++) {
                const s = Math.max(-1, Math.min(1, input[i]));
                view.setInt16(i * 2, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
            }
            return buffer;
        }

        function downsampleBuffer(buffer, sampleRate, outSampleRate) {
            if (outSampleRate === sampleRate) {
                return buffer;
            }
            if (outSampleRate > sampleRate) {
                return buffer; // Upsampling not supported/needed for this use case
            }
            
            const sampleRateRatio = sampleRate / outSampleRate;
            const newLength = Math.round(buffer.length / sampleRateRatio);
            const result = new Float32Array(newLength);
            
            let offsetResult = 0;
            let offsetBuffer = 0;
            
            while (offsetResult < result.length) {
                const nextOffsetBuffer = Math.round((offsetResult + 1) * sampleRateRatio);
                
                // Simple linear accumulation (averaging)
                let accum = 0, count = 0;
                for (let i = offsetBuffer; i < nextOffsetBuffer && i < buffer.length; i++) {
                    accum += buffer[i];
                    count++;
                }
                
                result[offsetResult] = count > 0 ? accum / count : 0;
                offsetResult++;
                offsetBuffer = nextOffsetBuffer;
            }
            
            return result;
        }

        function arrayBufferToBase64(buffer) {
            let binary = '';
            const bytes = new Uint8Array(buffer);
            for (let i = 0; i < bytes.byteLength; i++) {
                binary += String.fromCharCode(bytes[i]);
            }
            return window.btoa(binary);
        }

        function updateVisualizer(data) {
            let sum = 0;
            for (let i = 0; i < data.length; i += 100) {
                sum += Math.abs(data[i]);
            }
            const avg = sum / (data.length / 100);
            
            bars.forEach((bar) => {
                const h = Math.max(10, Math.min(100, avg * 500 * (Math.random() + 0.5)));
                bar.style.height = h + 'px';
                if (avg > 0.1) bar.classList.add('active');
                else bar.classList.remove('active');
            });
        }

         // Audio Queue Management
        let audioQueue = [];
        let isPlaying = false;
        let nextStartTime = 0;

        function playPcmAudio(base64Data) {
            audioQueue.push(base64Data);
            processAudioQueue();
        }

        function processAudioQueue() {
            if (isPlaying || audioQueue.length === 0) return;
            
            isPlaying = true;
            const base64Data = audioQueue.shift();

            try {
                const binaryString = window.atob(base64Data);
                const bytes = new Uint8Array(binaryString.length);
                for (let i = 0; i < binaryString.length; i++) {
                    bytes[i] = binaryString.charCodeAt(i);
                }
                
                const int16 = new Int16Array(bytes.buffer);
                const float32 = new Float32Array(int16.length);
                for(let i=0; i<int16.length; i++) {
                    float32[i] = int16[i] / 32768;
                }

                const buffer = audioContext.createBuffer(1, float32.length, 24000); // Gemini sends 24kHz usually
                buffer.getChannelData(0).set(float32);

                const source = audioContext.createBufferSource();
                source.buffer = buffer;
                source.connect(audioContext.destination);
                
                // Ensure smooth sequential playback
                const currentTime = audioContext.currentTime;
                if (nextStartTime < currentTime) {
                    nextStartTime = currentTime;
                }
                
                source.start(nextStartTime);
                nextStartTime += buffer.duration;
                
                // When this chunk finishes, process next (with small overlap buffer)
                source.onended = () => {
                    // Don't wait strictly for onended to process next if we scheduled it
                    // But if queue was empty, we need to reset state
                    if (audioQueue.length === 0 && audioContext.currentTime >= nextStartTime) {
                        isPlaying = false;
                    }
                };
                
                // Process next chunk immediately to schedule it
                isPlaying = false; 
                processAudioQueue();

            } catch (e) {
                console.error('Error playing audio:', e);
                isPlaying = false;
            }
        }

        // ===== INIT =====
        updateStatus('Ready', '');
        log('Ready. WS: ' + WS_URL);
    </script>
</body>
</html>
