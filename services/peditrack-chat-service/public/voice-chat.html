<!DOCTYPE html>
<html lang="en">
<!-- v1.1 Force Update -->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PediTrack Live Voice</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1b1e;
            color: white;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            overflow: hidden;
        }
        .container {
            width: 100%;
            max-width: 500px;
            padding: 14px 14px 10px;
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 10px;
            height: 100dvh;
            overflow: hidden;
        }
        .header {
            padding-top: 4px;
        }
        .status-badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            background: rgba(255,255,255,0.1);
            font-size: 0.9rem;
            margin-bottom: 10px;
            transition: all 0.3s;
        }
        .status-badge.connected { background: rgba(16, 185, 129, 0.2); color: #10B981; }
        .status-badge.error { background: rgba(239, 68, 68, 0.2); color: #EF4444; }
        .status-badge.connecting { background: rgba(251, 191, 36, 0.2); color: #FBBF24; }
        
        .visualizer {
            height: 110px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            gap: 4px;
            flex-shrink: 0;
        }
        .bar {
            width: 6px;
            background: #6366f1;
            border-radius: 3px;
            height: 10px;
            transition: height 0.1s ease;
        }
        .bar.active { background: #818cf8; box-shadow: 0 0 10px #818cf8; }
        
        .controls {
            display: flex;
            gap: 20px;
            justify-content: center;
            align-items: center;
            padding: 8px 0 calc(8px + env(safe-area-inset-bottom));
            flex-shrink: 0;
        }
        .mic-btn {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: #4f46e5;
            border: none;
            color: white;
            font-size: 32px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(79, 70, 229, 0.4);
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .mic-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .mic-btn:active { transform: scale(0.95); }
        .mic-btn.listening {
            background: #ef4444;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); }
            70% { box-shadow: 0 0 0 20px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }
        
        .stop-btn {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: #dc2626;
            border: none;
            color: white;
            font-size: 24px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(220, 38, 38, 0.4);
            transition: all 0.2s;
            display: none;
        }
        .stop-btn:hover { background: #b91c1c; }
        .stop-btn:active { transform: scale(0.95); }
        .stop-btn.visible { display: flex; align-items: center; justify-content: center; }
        
        .transcript-area {
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            padding: 12px;
            margin: 0;
            min-height: 110px;
            flex: 1;
            overflow-y: auto;
            text-align: left;
            font-size: 1rem;
            line-height: 1.6;
        }
        .transcript-area .user-msg {
            color: #60a5fa;
            margin-bottom: 8px;
        }
        .transcript-area .ai-msg {
            color: #34d399;
            margin-bottom: 8px;
        }
        .transcript-area .label {
            font-weight: bold;
            opacity: 0.8;
        }
        
        .debug-info {
            font-size: 0.7rem;
            color: #666;
            margin-top: 10px;
        }
        
        .user-speech-box {
            background: rgba(96, 165, 250, 0.15);
            border: 1px solid rgba(96, 165, 250, 0.3);
            border-radius: 12px;
            padding: 12px 15px;
            margin: 0;
            min-height: 50px;
            text-align: left;
            font-size: 0.95rem;
        }
        .user-speech-box .label {
            color: #60a5fa;
            font-weight: bold;
            font-size: 0.8rem;
            display: block;
            margin-bottom: 4px;
        }
        .user-speech-box .content {
            color: #fff;
            display: block;
            word-break: break-word;
        }
        .ai-speech-box {
            background: rgba(34, 197, 94, 0.15);
            border: 1px solid rgba(34, 197, 94, 0.3);
            border-radius: 12px;
            padding: 12px 15px;
            margin: 0;
            min-height: 50px;
            text-align: left;
            font-size: 0.95rem;
        }
        .ai-speech-box .label {
            color: #22c55e;
            font-weight: bold;
            font-size: 0.8rem;
            display: block;
            margin-bottom: 4px;
        }
        .ai-speech-box .content {
            color: #fff;
            display: block;
            word-break: break-word;
        }
        .language-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin: 0;
            flex-wrap: wrap;
        }
        .language-row label {
            font-size: 0.85rem;
            opacity: 0.85;
        }
        .language-select {
            background: rgba(255,255,255,0.08);
            color: #fff;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 8px;
            padding: 6px 10px;
            font-size: 0.9rem;
        }
        .language-note {
            font-size: 0.75rem;
            color: #fbbf24;
            min-height: 18px;
            margin: 0;
        }

        @media (max-height: 760px) {
            .container {
                gap: 8px;
                padding: 10px 10px 8px;
            }
            .mic-btn {
                width: 68px;
                height: 68px;
                font-size: 28px;
            }
            .stop-btn {
                width: 54px;
                height: 54px;
                font-size: 22px;
            }
            .visualizer {
                height: 78px;
            }
            .user-speech-box,
            .ai-speech-box {
                padding: 10px 12px;
                min-height: 44px;
                font-size: 0.9rem;
            }
            .transcript-area {
                min-height: 90px;
                font-size: 0.92rem;
            }
            .debug-info {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div id="status" class="status-badge">Ready</div>
            <h2>Gemini Live</h2>
        </div>

        <div class="user-speech-box" id="userSpeechBox">
            <span class="label">🎤 What You Said:</span>
            <span class="content" id="userSpeechContent">Waiting for your voice...</span>
        </div>

        <div class="ai-speech-box" id="aiSpeechBox">
            <span class="label">🤖 AI Response (Text):</span>
            <span class="content" id="aiSpeechContent">AI will respond here...</span>
        </div>

        <div class="language-row">
            <label for="languageSelect">Language</label>
            <select id="languageSelect" class="language-select">
                <option value="en">English</option>
                <option value="ta">தமிழ் (Tamil)</option>
                <option value="si">සිංහල (Sinhala)</option>
            </select>
        </div>
        <div id="languageNote" class="language-note"></div>

        <div class="transcript-area" id="transcript">
            Tap the microphone to start a live conversation...
        </div>

        <div class="visualizer" id="visualizer">
            <!-- Bars generated by JS -->
        </div>

        <div class="controls">
            <button id="micBtn" class="mic-btn">🎙️</button>
            <button id="stopBtn" class="stop-btn">⏹️</button>
        </div>
        
        <div class="debug-info" id="debugInfo"></div>
    </div>

    <script>
        // ===== CONFIGURATION =====
        // Using Railway hosted backend with HTTPS/WSS
        const SERVER_HOST = 'peditrack-chat-service-production-0d1d.up.railway.app';
        
        // Industry Standard Spec for Gemini Live
        const INPUT_SAMPLE_RATE = 16000;  // Send 16kHz to Gemini
        const OUTPUT_SAMPLE_RATE = 24000; // Gemini replies at 24kHz
        
        // ===== STATE =====
        let ws = null;
        let audioContext = null;
        let processor = null;
        let mediaStream = null;
        let isListening = false;
        let isConnecting = false;
        let isIntentionalClose = false;

        // ===== DOM ELEMENTS =====
        const statusEl = document.getElementById('status');
        const micBtn = document.getElementById('micBtn');
        const stopBtn = document.getElementById('stopBtn');
        const visualizer = document.getElementById('visualizer');
        const transcriptEl = document.getElementById('transcript');
        const debugInfo = document.getElementById('debugInfo');
        const userSpeechContent = document.getElementById('userSpeechContent');
        const aiSpeechContent = document.getElementById('aiSpeechContent');
        const languageSelect = document.getElementById('languageSelect');
        const languageNote = document.getElementById('languageNote');

        const LANGUAGE_LABELS = {
            en: 'English',
            ta: 'Tamil',
            si: 'Sinhala'
        };
        let selectedLanguage = 'en';

        // Show debug info
        debugInfo.textContent = 'Waiting for connection...';

        function updateLanguageNote() {
            if (selectedLanguage === 'si') {
                languageNote.textContent = 'Sinhala support depends on Live model language coverage and may be less accurate than English/Tamil.';
            } else {
                languageNote.textContent = '';
            }
        }

        languageSelect.addEventListener('change', () => {
            selectedLanguage = languageSelect.value;
            updateLanguageNote();

            // Apply on next session; reconnect if currently active
            if (ws && ws.readyState === WebSocket.OPEN) {
                endCall();
            }
        });
        updateLanguageNote();

        // Create visualizer bars
        for (let i = 0; i < 15; i++) {
            const bar = document.createElement('div');
            bar.className = 'bar';
            visualizer.appendChild(bar);
        }
        const bars = document.querySelectorAll('.bar');

        // ===== STATUS HELPERS =====
        function updateStatus(text, type = '') {
            statusEl.textContent = text;
            statusEl.className = 'status-badge ' + type;
        }

        function log(message) {
            console.log('[VoiceChat]', message);
            debugInfo.textContent = message;
        }
        
        // Add transcript message to the conversation display
        function addTranscript(label, text, className) {
            // Clear placeholder text if present
            if (transcriptEl.querySelector('span[style*="opacity"]')) {
                transcriptEl.innerHTML = '';
            }
            
            const msgDiv = document.createElement('div');
            msgDiv.className = className;
            msgDiv.innerHTML = `<span class="label">${label}:</span> ${text}`;
            transcriptEl.appendChild(msgDiv);
            
            // Auto-scroll to bottom
            transcriptEl.scrollTop = transcriptEl.scrollHeight;
        }
        
        // Clear transcript when starting new session
        function clearTranscript() {
            transcriptEl.innerHTML = '<span style="opacity:0.5">Listening... Speak now!</span>';
        }

        async function initAudio() {
            try {
                log('Requesting microphone...');
                
                // OPTIMIZED: Request 16kHz directly + enable all processing
                mediaStream = await navigator.mediaDevices.getUserMedia({
                    audio: {
                        channelCount: 1,
                        // Keep capture near device-native quality, worklet handles 16kHz output
                        sampleRate: { ideal: 48000 },
                        echoCancellation: true,         // Essential for speech
                        noiseSuppression: true,         // Essential for clarity
                        autoGainControl: true,          // Normalize volume
                        latency: 0.01                   // Low latency
                    }
                });

                // Create AudioContext
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                
                log(`Audio: ${audioContext.sampleRate}Hz (requested 16kHz)`);

                // Load AudioWorklet from external file (CSP-compliant)
                await audioContext.audioWorklet.addModule('/audio-worklet.js');
                log('Worklet loaded with 20ms frames');

                // Create audio processing pipeline
                const source = audioContext.createMediaStreamSource(mediaStream);
                processor = new AudioWorkletNode(audioContext, 'audio-recorder-worklet');

                // Handle audio data from worklet
                processor.port.onmessage = async (event) => {
                    if (!isListening || !ws || ws.readyState !== WebSocket.OPEN) return;
                    
                    const msg = event.data;
                    if (msg.type === 'audio') {
                        try {
                            // Convert to Float32Array
                            const float32Samples = new Float32Array(msg.data);
                            
                            // Normalize quiet speech before encoding
                            const normalized = normalizeAudio(float32Samples);
                            
                            // Visualizer using RMS from worklet
                            updateVisualizerLevel(msg.rms || 0);
                            // IMPORTANT: audio-worklet.js already outputs 16kHz
                            // Do not resample again here (double-resampling hurts transcript accuracy).
                            const finalSamples = normalized;
                            
                            // Convert to Int16 PCM
                            const pcmData = floatTo16BitPCM(finalSamples);

                            // Send to server
                            ws.send(JSON.stringify({
                                type: 'audio',
                                data: arrayBufferToBase64(pcmData.buffer),
                                sampleRate: INPUT_SAMPLE_RATE
                            }));
                        } catch (err) {
                            console.error('Audio processing error:', err);
                        }
                    }
                };

                source.connect(processor);
                // Note: AudioWorkletNode doesn't need to connect to destination

                log('Microphone ready (AudioWorklet)');
                return true;
            } catch (err) {
                console.error('Audio init error:', err);
                log('Mic error: ' + err.message);
                updateStatus('Microphone Error', 'error');
                return false;
            }
        }

        // Normalize very quiet speech to improve ASR quality without clipping louder input
        function normalizeAudio(samples) {
            let maxAmp = 0;
            for (let i = 0; i < samples.length; i++) {
                const value = Math.abs(samples[i]);
                if (value > maxAmp) maxAmp = value;
            }

            // Leave silence and already-loud audio untouched
            if (maxAmp <= 0.01 || maxAmp >= 0.5) {
                return samples;
            }

            const gain = 0.7 / maxAmp;
            const normalized = new Float32Array(samples.length);
            for (let i = 0; i < samples.length; i++) {
                const boosted = samples[i] * gain;
                normalized[i] = Math.max(-1, Math.min(1, boosted));
            }
            return normalized;
        }

        // Simple visualizer update
        function updateVisualizerLevel(level) {
            bars.forEach((bar) => {
                const h = Math.max(10, Math.min(100, level * 300 * (Math.random() + 0.5)));
                bar.style.height = h + 'px';
                if (level > 0.02) bar.classList.add('active');
                else bar.classList.remove('active');
            });
        }

        // ===== WEBSOCKET CONNECTION =====
        function connectWebSocket() {
            return new Promise((resolve, reject) => {
                // Generate fresh ID for every connection to ensure no memory of previous chat
                const conversationId = 'voice-' + Math.random().toString(36).substring(2, 9) + '-' + Date.now();
                const wsUrl = `wss://${SERVER_HOST}/ws/live?conversationId=${conversationId}&language=${encodeURIComponent(selectedLanguage)}`;
                
                log(`Connecting (${LANGUAGE_LABELS[selectedLanguage] || selectedLanguage})...`);
                updateStatus('Connecting...', 'connecting');
                isConnecting = true;

                try {
                    ws = new WebSocket(wsUrl);
                } catch (err) {
                    log('WS create error: ' + err.message);
                    reject(err);
                    return;
                }
                
                const timeout = setTimeout(() => {
                    log('Connection timeout');
                    ws.close();
                    reject(new Error('Connection timeout'));
                }, 10000);

                ws.onopen = () => {
                    clearTimeout(timeout);
                    isConnecting = false;
                    isIntentionalClose = false;
                    log('Connected!');
                    updateStatus('Connected', 'connected');
                    stopBtn.classList.add('visible'); // Show stop button
                    resolve();
                };

                ws.onmessage = async (event) => {
                    try {
                        const msg = JSON.parse(event.data);
                        
                        if (msg.type === 'audio') {
                            playPcmAudio(msg.data);
                        } else if (msg.type === 'user_transcript') {
                            // Show what user said in the dedicated box
                            userSpeechContent.textContent = msg.text;
                            // Also add to conversation log
                            addTranscript('You', msg.text, 'user-msg');
                        } else if (msg.type === 'ai_transcript') {
                            // Show what AI said (text version) in dedicated green box
                            aiSpeechContent.textContent = msg.text;
                            // Also add to conversation log
                            addTranscript('AI', msg.text, 'ai-msg');
                        } else if (msg.type === 'text') {
                            // Fallback for text responses
                            aiSpeechContent.textContent = msg.text;
                            addTranscript('AI', msg.text, 'ai-msg');
                        } else if (msg.type === 'interrupted') {
                            // Gemini interrupted current generation (user started speaking)
                            audioQueue = [];
                            isPlaying = false;
                            nextStartTime = audioContext ? audioContext.currentTime : 0;
                        } else if (msg.type === 'session_created') {
                            log('Session: ' + msg.sessionId.substring(0, 8) + '...');
                            if (msg.language) {
                                selectedLanguage = msg.language;
                                languageSelect.value = msg.language;
                                updateLanguageNote();
                            }
                        } else if (msg.type === 'setup_complete') {
                            log('Gemini ready');
                            transcriptEl.innerHTML = '<span style="opacity:0.5">Listening... Speak now!</span>';
                        } else if (msg.type === 'error') {
                            log('Error: ' + msg.error);
                            updateStatus('Error', 'error');
                            transcriptEl.innerHTML = '<span style="color:#ef4444">Error: ' + msg.error + '</span>';
                        }
                    } catch (err) {
                        console.error('Message parse error:', err);
                    }
                };

                ws.onclose = (event) => {
                    clearTimeout(timeout);
                    isConnecting = false;
                    isListening = false;
                    micBtn.classList.remove('listening');
                    if (isIntentionalClose) {
                        isIntentionalClose = false;
                        updateStatus('Ready', '');
                        transcriptEl.textContent = 'Call ended. Tap the microphone to start a new conversation.';
                        log('Call ended');
                    } else {
                        log(`Disconnected (code: ${event.code})`);
                        updateStatus('Disconnected', 'error');
                        transcriptEl.textContent = 'Connection closed. Tap to reconnect.';
                    }
                    stopBtn.classList.remove('visible');
                    ws = null;
                };

                ws.onerror = (e) => {
                    clearTimeout(timeout);
                    isConnecting = false;
                    console.error('WS Error:', e);
                    log('Connection failed');
                    updateStatus('Connection Failed', 'error');
                    reject(new Error('WebSocket error'));
                };
            });
        }

        // ===== MIC BUTTON HANDLER =====
        micBtn.onclick = async () => {
            // Already connecting, ignore
            if (isConnecting) {
                log('Already connecting...');
                return;
            }

            // If already connected and listening, toggle off
            if (ws && ws.readyState === WebSocket.OPEN && isListening) {
                stopListening();
                return;
            }

            // If connected but not listening, start listening
            if (ws && ws.readyState === WebSocket.OPEN && !isListening) {
                startListening();
                return;
            }

            // Need to initialize everything
            micBtn.disabled = true;
            
            try {
                // Step 1: Initialize audio if needed
                if (!audioContext) {
                    const audioOk = await initAudio();
                    if (!audioOk) {
                        micBtn.disabled = false;
                        return;
                    }
                }

                // Step 2: Connect WebSocket
                await connectWebSocket();

                // Step 3: Start listening
                startListening();
                
            } catch (err) {
                log('Failed: ' + err.message);
                updateStatus('Failed', 'error');
            }

            micBtn.disabled = false;
        };

        function startListening() {
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                log('Not connected');
                return;
            }
            
            if (audioContext && audioContext.state === 'suspended') {
                audioContext.resume();
            }
            
            isListening = true;
            micBtn.classList.add('listening');
            updateStatus('Listening...', 'connected');
            transcriptEl.textContent = 'Listening... Speak now!';
            log('Listening started');
        }

        function stopListening() {
            isListening = false;
            micBtn.classList.remove('listening');
            updateStatus('Paused', '');
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: 'audio_stream_end' }));
            }
            log('Paused');
        }

        // ===== STOP/END CALL =====
        stopBtn.onclick = () => {
            endCall();
        };

        function endCall() {
            // Stop listening
            isListening = false;
            isConnecting = false;
            micBtn.classList.remove('listening');
            isIntentionalClose = true;
            
            // Close WebSocket
            if (ws) {
                if (ws.readyState === WebSocket.OPEN) {
                    ws.send(JSON.stringify({ type: 'audio_stream_end' }));
                }
                ws.close();
            } else {
                isIntentionalClose = false;
            }
            
            // Clear audio queue
            audioQueue = [];
            isPlaying = false;
            nextStartTime = 0;
            
            // Hide stop button
            stopBtn.classList.remove('visible');
            
            // Reset UI
            updateStatus('Ready', '');
            transcriptEl.textContent = 'Call ended. Tap the microphone to start a new conversation.';
            log('Call ended');
        }

        // ===== AUDIO HELPERS =====
        // Simple Float32 -> Int16 conversion
        function floatTo16BitPCM(input) {
            const output = new Int16Array(input.length);
            for (let i = 0; i < input.length; i++) {
                // Clamp and scale
                const s = Math.max(-1, Math.min(1, input[i]));
                // Convert to 16-bit
                output[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
            }
            return output;
        }

        // Helper to encode buffer to base64
        function arrayBufferToBase64(buffer) {
            let binary = '';
            const bytes = new Uint8Array(buffer);
            const len = bytes.byteLength;
            for (let i = 0; i < len; i++) {
                binary += String.fromCharCode(bytes[i]);
            }
            return btoa(binary);
        }

        function updateVisualizer(data) {
            let sum = 0;
            for (let i = 0; i < data.length; i += 100) {
                sum += Math.abs(data[i]);
            }
            const avg = sum / (data.length / 100);
            
            bars.forEach((bar) => {
                const h = Math.max(10, Math.min(100, avg * 500 * (Math.random() + 0.5)));
                bar.style.height = h + 'px';
                if (avg > 0.1) bar.classList.add('active');
                else bar.classList.remove('active');
            });
        }

         // Audio Queue Management
        let audioQueue = [];
        let isPlaying = false;
        let nextStartTime = 0;

        function playPcmAudio(base64Data) {
            audioQueue.push(base64Data);
            processAudioQueue();
        }

        function processAudioQueue() {
            if (isPlaying || audioQueue.length === 0) return;
            
            isPlaying = true;
            const base64Data = audioQueue.shift();

            try {
                const binaryString = window.atob(base64Data);
                const bytes = new Uint8Array(binaryString.length);
                for (let i = 0; i < binaryString.length; i++) {
                    bytes[i] = binaryString.charCodeAt(i);
                }
                
                const int16 = new Int16Array(bytes.buffer);
                const float32 = new Float32Array(int16.length);
                for(let i=0; i<int16.length; i++) {
                    float32[i] = int16[i] / 32768;
                }

                const buffer = audioContext.createBuffer(1, float32.length, OUTPUT_SAMPLE_RATE); // 24kHz standard output
                buffer.getChannelData(0).set(float32);

                const source = audioContext.createBufferSource();
                source.buffer = buffer;
                source.connect(audioContext.destination);
                
                // Ensure smooth sequential playback
                const currentTime = audioContext.currentTime;
                if (nextStartTime < currentTime) {
                    nextStartTime = currentTime;
                }
                
                source.start(nextStartTime);
                nextStartTime += buffer.duration;
                
                // When this chunk finishes, process next (with small overlap buffer)
                source.onended = () => {
                    // Don't wait strictly for onended to process next if we scheduled it
                    // But if queue was empty, we need to reset state
                    if (audioQueue.length === 0 && audioContext.currentTime >= nextStartTime) {
                        isPlaying = false;
                    }
                };
                
                // Process next chunk immediately to schedule it
                isPlaying = false; 
                processAudioQueue();

            } catch (e) {
                console.error('Error playing audio:', e);
                isPlaying = false;
            }
        }

        // ===== INIT =====
        updateStatus('Ready', '');
        log('Ready. Tap mic to start fresh session.');
    </script>
</body>
</html>
