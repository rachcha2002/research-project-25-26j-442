<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PediTrack Voice - Optimized</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1b1e;
            color: white;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .container {
            width: 100%;
            max-width: 500px;
            padding: 20px;
            text-align: center;
            display: flex;
            flex-direction: column;
            height: 100%;
        }
        .header {
            margin-bottom: auto;
            padding-top: 20px;
        }
        .status-badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            background: rgba(255,255,255,0.1);
            font-size: 0.9rem;
            margin-bottom: 10px;
            transition: all 0.3s;
        }
        .status-badge.connected { background: rgba(16, 185, 129, 0.2); color: #10B981; }
        .status-badge.error { background: rgba(239, 68, 68, 0.2); color: #EF4444; }
        .status-badge.connecting { background: rgba(251, 191, 36, 0.2); color: #FBBF24; }
        
        .visualizer {
            height: 150px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 20px 0;
            gap: 4px;
        }
        .bar {
            width: 6px;
            background: #6366f1;
            border-radius: 3px;
            height: 10px;
            transition: height 0.1s ease;
        }
        .bar.active { background: #818cf8; box-shadow: 0 0 10px #818cf8; }
        
        .controls {
            margin-top: auto;
            margin-bottom: 40px;
            display: flex;
            gap: 20px;
            justify-content: center;
            align-items: center;
        }
        .mic-btn {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: #4f46e5;
            border: none;
            color: white;
            font-size: 32px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(79, 70, 229, 0.4);
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .mic-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .mic-btn:active { transform: scale(0.95); }
        .mic-btn.listening {
            background: #ef4444;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); }
            70% { box-shadow: 0 0 0 20px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }
        
        .stop-btn {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: #dc2626;
            border: none;
            color: white;
            font-size: 24px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(220, 38, 38, 0.4);
            transition: all 0.2s;
            display: none;
        }
        .stop-btn:hover { background: #b91c1c; }
        .stop-btn:active { transform: scale(0.95); }
        .stop-btn.visible { display: flex; align-items: center; justify-content: center; }
        
        .transcript-area {
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            padding: 15px;
            margin: 20px 0;
            min-height: 120px;
            max-height: 200px;
            overflow-y: auto;
            text-align: left;
            font-size: 1rem;
            line-height: 1.6;
        }
        .transcript-area .user-msg {
            color: #60a5fa;
            margin-bottom: 8px;
        }
        .transcript-area .ai-msg {
            color: #34d399;
            margin-bottom: 8px;
        }
        .transcript-area .label {
            font-weight: bold;
            opacity: 0.8;
        }
        
        .debug-info {
            font-size: 0.7rem;
            color: #666;
            margin-top: 10px;
        }
        
        .user-speech-box {
            background: rgba(96, 165, 250, 0.15);
            border: 1px solid rgba(96, 165, 250, 0.3);
            border-radius: 12px;
            padding: 12px 15px;
            margin: 10px 0;
            min-height: 50px;
            text-align: left;
            font-size: 0.95rem;
        }
        .user-speech-box .label {
            color: #60a5fa;
            font-weight: bold;
            font-size: 0.8rem;
            display: block;
            margin-bottom: 4px;
        }
        .user-speech-box .content {
            color: #fff;
        }
        .ai-speech-box {
            background: rgba(34, 197, 94, 0.15);
            border: 1px solid rgba(34, 197, 94, 0.3);
            border-radius: 12px;
            padding: 12px 15px;
            margin: 10px 0;
            min-height: 50px;
            text-align: left;
            font-size: 0.95rem;
        }
        .ai-speech-box .label {
            color: #22c55e;
            font-weight: bold;
            font-size: 0.8rem;
            display: block;
            margin-bottom: 4px;
        }
        .ai-speech-box .content {
            color: #fff;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div id="status" class="status-badge">Ready</div>
            <h2>PediTrack Voice (Optimized)</h2>
        </div>

        <div class="user-speech-box">
            <span class="label">🎤 You Said:</span>
            <span class="content" id="userSpeechContent">Waiting for your voice...</span>
        </div>

        <div class="ai-speech-box">
            <span class="label">🤖 AI Response:</span>
            <span class="content" id="aiSpeechContent">AI will respond here...</span>
        </div>

        <div class="transcript-area" id="transcript">
            Tap the microphone to start talking...
        </div>

        <div class="visualizer" id="visualizer"></div>

        <div class="controls">
            <button id="micBtn" class="mic-btn">🎙️</button>
            <button id="stopBtn" class="stop-btn">⏹️</button>
        </div>
        
        <div class="debug-info" id="debugInfo"></div>
    </div>

    <script>
        // ===== CONFIG =====
        const SERVER_HOST = 'research-project-25-26j-442-production-dc5b.up.railway.app';
        const INPUT_SAMPLE_RATE = 16000;
        const OUTPUT_SAMPLE_RATE = 24000;
        
        // ===== STATE =====
        let ws = null;
        let audioContext = null;
        let processor = null;
        let mediaStream = null;
        let isListening = false;
        let isConnecting = false;

        // ===== DOM =====
        const statusEl = document.getElementById('status');
        const micBtn = document.getElementById('micBtn');
        const stopBtn = document.getElementById('stopBtn');
        const visualizer = document.getElementById('visualizer');
        const transcriptEl = document.getElementById('transcript');
        const debugInfo = document.getElementById('debugInfo');
        const userSpeechContent = document.getElementById('userSpeechContent');
        const aiSpeechContent = document.getElementById('aiSpeechContent');

        for (let i = 0; i < 15; i++) {
            const bar = document.createElement('div');
            bar.className = 'bar';
            visualizer.appendChild(bar);
        }
        const bars = document.querySelectorAll('.bar');

        function updateStatus(text, type = '') {
            statusEl.textContent = text;
            statusEl.className = 'status-badge ' + type;
        }

        function log(msg) {
            console.log('[Voice]', msg);
            debugInfo.textContent = msg;
        }
        
        function addTranscript(label, text, className) {
            if (transcriptEl.querySelector('span[style*="opacity"]')) {
                transcriptEl.innerHTML = '';
            }
            const msgDiv = document.createElement('div');
            msgDiv.className = className;
            msgDiv.innerHTML = `<span class="label">${label}:</span> ${text}`;
            transcriptEl.appendChild(msgDiv);
            transcriptEl.scrollTop = transcriptEl.scrollHeight;
        }

        // ===== AUDIO INIT =====
        async function initAudio() {
            try {
                log('Requesting microphone...');
                
                // FIXED: Enable noise suppression
                mediaStream = await navigator.mediaDevices.getUserMedia({
                    audio: {
                        channelCount: 1,
                        echoCancellation: true,
                        noiseSuppression: true,  // CRITICAL FIX
                        autoGainControl: true,
                        sampleRate: { ideal: 48000 }
                    }
                });

                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                log(`Audio: ${audioContext.sampleRate}Hz → 16kHz`);

                // FIXED: Inline worklet (no 404)
                const workletCode = `
class AudioRecorderWorklet extends AudioWorkletProcessor {
    constructor() {
        super();
        this.bufferSize = 2400;
        this.buffer = [];
    }
    process(inputs) {
        const input = inputs[0];
        if (!input || !input[0]) return true;
        const channelData = input[0];
        for (let i = 0; i < channelData.length; i++) {
            this.buffer.push(channelData[i]);
        }
        if (this.buffer.length >= this.bufferSize) {
            const chunk = new Float32Array(this.buffer);
            this.port.postMessage({ audioData: chunk.buffer }, [chunk.buffer]);
            this.buffer = [];
        }
        return true;
    }
}
registerProcessor('audio-recorder-worklet', AudioRecorderWorklet);
`;
                const blob = new Blob([workletCode], { type: 'application/javascript' });
                const workletUrl = URL.createObjectURL(blob);
                await audioContext.audioWorklet.addModule(workletUrl);
                log('Worklet loaded');

                const source = audioContext.createMediaStreamSource(mediaStream);
                processor = new AudioWorkletNode(audioContext, 'audio-recorder-worklet');

                processor.port.onmessage = async (event) => {
                    if (!isListening || !ws || ws.readyState !== WebSocket.OPEN) return;
                    
                    const audioData = event.data.audioData;
                    if (!audioData) return;
                    
                    try {
                        const float32 = new Float32Array(audioData);
                        
                        // ADDED: Normalize
                        const normalized = normalizeAudio(float32);
                        updateVisualizerLevel(normalized);

                        // OPTIMIZED: Single resample
                        const resampled = await resampleAudioOptimized(
                            normalized,
                            audioContext.sampleRate,
                            INPUT_SAMPLE_RATE
                        );
                        
                        const pcmData = floatTo16BitPCM(resampled);

                        ws.send(JSON.stringify({
                            type: 'audio',
                            data: arrayBufferToBase64(pcmData.buffer),
                            sampleRate: INPUT_SAMPLE_RATE
                        }));
                    } catch (err) {
                        console.error('Audio error:', err);
                    }
                };

                source.connect(processor);
                log('Mic ready ✓');
                return true;
            } catch (err) {
                log('Mic error: ' + err.message);
                updateStatus('Mic Error', 'error');
                return false;
            }
        }

        // ADDED: Normalize quiet speech
        function normalizeAudio(samples) {
            let maxAmp = 0;
            for (let i = 0; i < samples.length; i++) {
                maxAmp = Math.max(maxAmp, Math.abs(samples[i]));
            }
            
            if (maxAmp > 0.01 && maxAmp < 0.5) {
                const gain = 0.7 / maxAmp;
                const normalized = new Float32Array(samples.length);
                for (let i = 0; i < samples.length; i++) {
                    normalized[i] = Math.max(-1, Math.min(1, samples[i] * gain));
                }
                return normalized;
            }
            return samples;
        }

        function updateVisualizerLevel(samples) {
            let sum = 0;
            for (let i = 0; i < samples.length; i += 10) {
                sum += samples[i] * samples[i];
            }
            const rms = Math.sqrt(sum / (samples.length / 10));
            
            bars.forEach((bar) => {
                const h = Math.max(10, Math.min(100, rms * 800 * (0.8 + Math.random() * 0.4)));
                bar.style.height = h + 'px';
                bar.classList.toggle('active', rms > 0.02);
            });
        }

        // ===== WEBSOCKET =====
        function connectWebSocket() {
            return new Promise((resolve, reject) => {
                const id = 'voice-' + Date.now() + '-' + Math.random().toString(36).slice(2, 9);
                const wsUrl = `wss://${SERVER_HOST}/ws/live?conversationId=${id}`;
                
                log('Connecting...');
                updateStatus('Connecting...', 'connecting');
                isConnecting = true;

                try {
                    ws = new WebSocket(wsUrl);
                } catch (err) {
                    log('Failed: ' + err.message);
                    reject(err);
                    return;
                }
                
                const timeout = setTimeout(() => {
                    ws.close();
                    reject(new Error('Timeout'));
                }, 10000);

                ws.onopen = () => {
                    clearTimeout(timeout);
                    isConnecting = false;
                    log('Connected ✓');
                    updateStatus('Connected', 'connected');
                    stopBtn.classList.add('visible');
                    resolve();
                };

                ws.onmessage = async (event) => {
                    try {
                        const msg = JSON.parse(event.data);
                        
                        if (msg.type === 'audio') {
                            playPcmAudio(msg.data);
                        } else if (msg.type === 'user_transcript') {
                            userSpeechContent.textContent = msg.text;
                            addTranscript('You', msg.text, 'user-msg');
                        } else if (msg.type === 'ai_transcript') {
                            aiSpeechContent.textContent = msg.text;
                            addTranscript('AI', msg.text, 'ai-msg');
                        } else if (msg.type === 'text') {
                            aiSpeechContent.textContent = msg.text;
                            addTranscript('AI', msg.text, 'ai-msg');
                        } else if (msg.type === 'setup_complete') {
                            log('AI ready');
                            transcriptEl.innerHTML = '<span style="opacity:0.5">Speak now!</span>';
                        } else if (msg.type === 'error') {
                            log('Error: ' + msg.error);
                            updateStatus('Error', 'error');
                        }
                    } catch (err) {
                        console.error('Message error:', err);
                    }
                };

                ws.onclose = () => {
                    clearTimeout(timeout);
                    isConnecting = false;
                    isListening = false;
                    micBtn.classList.remove('listening');
                    log('Disconnected');
                    updateStatus('Disconnected', 'error');
                    ws = null;
                };

                ws.onerror = () => {
                    clearTimeout(timeout);
                    isConnecting = false;
                    log('Connection failed');
                    reject(new Error('WS error'));
                };
            });
        }

        // ===== CONTROLS =====
        micBtn.onclick = async () => {
            if (isConnecting) return;

            if (ws && ws.readyState === WebSocket.OPEN && isListening) {
                isListening = false;
                micBtn.classList.remove('listening');
                updateStatus('Paused', '');
                log('Paused');
                return;
            }

            if (ws && ws.readyState === WebSocket.OPEN && !isListening) {
                if (audioContext.state === 'suspended') audioContext.resume();
                isListening = true;
                micBtn.classList.add('listening');
                updateStatus('Listening...', 'connected');
                log('Recording...');
                return;
            }

            micBtn.disabled = true;
            
            try {
                if (!audioContext) {
                    const ok = await initAudio();
                    if (!ok) {
                        micBtn.disabled = false;
                        return;
                    }
                }

                await connectWebSocket();
                
                if (audioContext.state === 'suspended') audioContext.resume();
                isListening = true;
                micBtn.classList.add('listening');
                updateStatus('Listening...', 'connected');
                log('Recording...');
                
            } catch (err) {
                log('Failed: ' + err.message);
                updateStatus('Failed', 'error');
            }

            micBtn.disabled = false;
        };

        stopBtn.onclick = () => {
            isListening = false;
            isConnecting = false;
            micBtn.classList.remove('listening');
            
            if (ws) {
                ws.close();
                ws = null;
            }
            
            audioQueue = [];
            isPlaying = false;
            nextStartTime = 0;
            
            stopBtn.classList.remove('visible');
            updateStatus('Ready', '');
            log('Ended');
        };

        // ===== AUDIO UTILS =====
        
        async function resampleAudioOptimized(audioData, fromRate, toRate) {
            if (fromRate === toRate) return audioData;
            
            const outputLength = Math.floor(audioData.length * toRate / fromRate);
            const ctx = new OfflineAudioContext(1, outputLength, toRate);
            
            const buffer = ctx.createBuffer(1, audioData.length, fromRate);
            buffer.getChannelData(0).set(audioData);
            
            const source = ctx.createBufferSource();
            source.buffer = buffer;
            source.connect(ctx.destination);
            source.start(0);
            
            const rendered = await ctx.startRendering();
            return rendered.getChannelData(0);
        }
        
        function floatTo16BitPCM(input) {
            const output = new Int16Array(input.length);
            for (let i = 0; i < input.length; i++) {
                const s = Math.max(-1, Math.min(1, input[i]));
                output[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
            }
            return output;
        }

        function arrayBufferToBase64(buffer) {
            let binary = '';
            const bytes = new Uint8Array(buffer);
            for (let i = 0; i < bytes.length; i++) {
                binary += String.fromCharCode(bytes[i]);
            }
            return btoa(binary);
        }

        let audioQueue = [];
        let isPlaying = false;
        let nextStartTime = 0;

        function playPcmAudio(base64Data) {
            audioQueue.push(base64Data);
            processAudioQueue();
        }

        function processAudioQueue() {
            if (isPlaying || audioQueue.length === 0) return;
            
            isPlaying = true;
            const base64Data = audioQueue.shift();

            try {
                const binaryString = atob(base64Data);
                const bytes = new Uint8Array(binaryString.length);
                for (let i = 0; i < binaryString.length; i++) {
                    bytes[i] = binaryString.charCodeAt(i);
                }
                
                const int16 = new Int16Array(bytes.buffer);
                const float32 = new Float32Array(int16.length);
                for(let i=0; i<int16.length; i++) {
                    float32[i] = int16[i] / 32768;
                }

                const buffer = audioContext.createBuffer(1, float32.length, OUTPUT_SAMPLE_RATE);
                buffer.getChannelData(0).set(float32);

                const source = audioContext.createBufferSource();
                source.buffer = buffer;
                source.connect(audioContext.destination);
                
                const currentTime = audioContext.currentTime;
                if (nextStartTime < currentTime) nextStartTime = currentTime;
                
                source.start(nextStartTime);
                nextStartTime += buffer.duration;
                
                source.onended = () => {
                    if (audioQueue.length === 0 && audioContext.currentTime >= nextStartTime) {
                        isPlaying = false;
                    }
                };
                
                isPlaying = false;
                processAudioQueue();

            } catch (e) {
                console.error('Playback error:', e);
                isPlaying = false;
            }
        }

        updateStatus('Ready', '');
        log('Ready - tap mic');
    </script>
</body>
</html>
